services:
  user-db:
    image: postgres:17-alpine
    container_name: worktrition-user-db
    environment:
      POSTGRES_USER: ${USER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-password}
      POSTGRES_DB: ${USER_DB_NAME:-user_db}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  user-service:
    build:
      context: .
      dockerfile: ./backend/user-service/Dockerfile
    container_name: worktrition-user-service
    env_file:
      - .env
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${USER_GRPC_PORT:-50051}:${USER_GRPC_PORT:-50051}"
    stop_grace_period: 10s

  ai-db:
    image: postgres:17-alpine
    container_name: worktrition-ai-db
    environment:
      POSTGRES_USER: ${AI_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:-password}
      POSTGRES_DB: ${AI_DB_NAME:-ai_db}
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nutrition-db:
    image: postgres:17-alpine
    container_name: worktrition-nutrition-db
    environment:
      POSTGRES_USER: ${NUTRITION_DB_USER:-nutrition}
      POSTGRES_PASSWORD: ${NUTRITION_DB_PASSWORD:-nutrition}
      POSTGRES_DB: ${NUTRITION_DB_NAME:-nutrition}
    volumes:
      - nutrition-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nutrition-migrate:
    image: migrate/migrate
    container_name: worktrition-nutrition-migrate
    depends_on:
      nutrition-db:
        condition: service_healthy
    volumes:
      - ./backend/nutrition-service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${NUTRITION_DB_USER:-nutrition}:${NUTRITION_DB_PASSWORD:-nutrition}@nutrition-db:${NUTRITION_DB_PORT:-5432}/${NUTRITION_DB_NAME:-nutrition}?sslmode=${NUTRITION_DB_SSL_MODE:-disable}"
      - "up"
    restart: on-failure

  nutrition-service:
    build:
      context: .
      dockerfile: ./backend/nutrition-service/Dockerfile
    container_name: worktrition-nutrition-service
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${NUTRITION_DB_USER:-nutrition}:${NUTRITION_DB_PASSWORD:-nutrition}@nutrition-db:${NUTRITION_DB_PORT:-5432}/${NUTRITION_DB_NAME:-nutrition}?sslmode=${NUTRITION_DB_SSL_MODE:-disable}
      GRPC_PORT: ${NUTRITION_GRPC_PORT:-50052}
      GAMIFICATION_SERVICE_ADDR: gamification-service:${GAMIFICATION_GRPC_PORT:-50055}
    depends_on:
      nutrition-db:
        condition: service_healthy
      nutrition-migrate:
        condition: service_completed_successfully
      gamification-service:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${NUTRITION_HOST_GRPC_PORT:-50053}:${NUTRITION_GRPC_PORT:-50052}"
    stop_grace_period: 10s

  workout-db:
    image: postgres:17-alpine
    container_name: worktrition-workout-db
    environment:
      POSTGRES_USER: ${WORKOUT_DB_USER:-workout}
      POSTGRES_PASSWORD: ${WORKOUT_DB_PASSWORD:-workout}
      POSTGRES_DB: ${WORKOUT_DB_NAME:-workout}
    volumes:
      - workout-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  workout-migrate:
    image: migrate/migrate
    container_name: worktrition-workout-migrate
    depends_on:
      workout-db:
        condition: service_healthy
    volumes:
      - ./backend/workout-service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${WORKOUT_DB_USER:-workout}:${WORKOUT_DB_PASSWORD:-workout}@workout-db:${WORKOUT_DB_PORT:-5432}/${WORKOUT_DB_NAME:-workout}?sslmode=${WORKOUT_DB_SSL_MODE:-disable}"
      - "up"
    restart: on-failure

  workout-service:
    build:
      context: .
      dockerfile: ./backend/workout-service/Dockerfile
    container_name: worktrition-workout-service
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${WORKOUT_DB_USER:-workout}:${WORKOUT_DB_PASSWORD:-workout}@workout-db:${WORKOUT_DB_PORT:-5432}/${WORKOUT_DB_NAME:-workout}?sslmode=${WORKOUT_DB_SSL_MODE:-disable}
      GRPC_PORT: ${WORKOUT_GRPC_PORT:-50054}
      GAMIFICATION_SERVICE_ADDR: gamification-service:${GAMIFICATION_GRPC_PORT:-50055}
    depends_on:
      workout-db:
        condition: service_healthy
      workout-migrate:
        condition: service_completed_successfully
      gamification-service:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${WORKOUT_GRPC_PORT:-50054}:${WORKOUT_GRPC_PORT:-50054}"
    stop_grace_period: 10s

  gamification-db:
    image: postgres:17-alpine
    container_name: worktrition-gamification-db
    environment:
      POSTGRES_USER: ${GAMIFICATION_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${GAMIFICATION_DB_PASSWORD:-password}
      POSTGRES_DB: ${GAMIFICATION_DB_NAME:-gamification_db}
    volumes:
      - gamification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  gamification-service:
    build:
      context: .
      dockerfile: ./backend/gamification-service/Dockerfile
    container_name: worktrition-gamification-service
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${GAMIFICATION_DB_USER:-postgres}:${GAMIFICATION_DB_PASSWORD:-password}@gamification-db:${GAMIFICATION_DB_PORT:-5432}/${GAMIFICATION_DB_NAME:-gamification_db}?sslmode=${GAMIFICATION_DB_SSL_MODE:-disable}
      GRPC_PORT: ${GAMIFICATION_GRPC_PORT:-50055}
    depends_on:
      gamification-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${GAMIFICATION_GRPC_PORT:-50055}:${GAMIFICATION_GRPC_PORT:-50055}"
    stop_grace_period: 10s

  ai-service:
    build:
      context: .
      dockerfile: ./backend/ai-service/Dockerfile
    container_name: worktrition-ai-service
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${AI_DB_USER:-postgres}:${AI_DB_PASSWORD:-password}@ai-db:${AI_DB_PORT:-5432}/${AI_DB_NAME:-ai_db}?sslmode=${AI_DB_SSL_MODE:-disable}
      AI_GRPC_PORT: ${AI_GRPC_PORT:-50056}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-4o-mini}
      USER_SERVICE_ADDR: user-service:${USER_GRPC_PORT:-50051}
      NUTRITION_SERVICE_ADDR: nutrition-service:${NUTRITION_GRPC_PORT:-50052}
      WORKOUT_SERVICE_ADDR: workout-service:${WORKOUT_GRPC_PORT:-50054}
    depends_on:
      ai-db:
        condition: service_healthy
      user-service:
        condition: service_started
      nutrition-service:
        condition: service_started
      workout-service:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${AI_HOST_GRPC_PORT:-50056}:${AI_GRPC_PORT:-50056}"
    stop_grace_period: 10s

  api-gateway-service:
    build:
      context: .
      dockerfile: ./backend/api-gateway-service/Dockerfile
    container_name: worktrition-api-gateway
    env_file:
      - .env
    environment:
      USER_SERVICE_ADDR: user-service:${USER_GRPC_PORT:-50051}
      NUTRITION_SERVICE_ADDR: nutrition-service:${NUTRITION_GRPC_PORT:-50052}
      WORKOUT_SERVICE_ADDR: workout-service:${WORKOUT_GRPC_PORT:-50054}
      GAMIFICATION_SERVICE_ADDR: gamification-service:${GAMIFICATION_GRPC_PORT:-50055}
      AI_SERVICE_ADDR: ai-service:${AI_GRPC_PORT:-50056}
      USER_JWT_SECRET: ${USER_JWT_SECRET}
    depends_on:
      user-service:
        condition: service_started
      nutrition-service:
        condition: service_started
      workout-service:
        condition: service_started
      gamification-service:
        condition: service_started
      ai-service:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:${GATEWAY_HTTP_PORT:-8080}"
    stop_grace_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    container_name: worktrition-frontend
    depends_on:
      api-gateway-service:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:${GATEWAY_HTTP_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  user-db-data:
  ai-db-data:
  nutrition-db-data:
  workout-db-data:
  gamification-db-data:
