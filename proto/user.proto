syntax = "proto3";

package user;

option go_package = "github.com/noirbyss/worktrition-app/gen/user-service;user";

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc VerifyCredentials(VerifyCredentialsRequest) returns (VerifyCredentialsResponse);
  rpc SaveProfile(SaveProfileRequest) returns (SaveProfileResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
}

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
}

enum TrainingLevel {
  TRAINING_LEVEL_UNSPECIFIED = 0;
  TRAINING_LEVEL_BEGINNER = 1;
  TRAINING_LEVEL_INTERMEDIATE = 2;
  TRAINING_LEVEL_ADVANCED = 3;
}

enum ActivityLevel {
  ACTIVITY_LEVEL_UNSPECIFIED = 0;
  ACTIVITY_LEVEL_SEDENTARY = 1;
  ACTIVITY_LEVEL_LIGHT = 2;
  ACTIVITY_LEVEL_MODERATE = 3;
  ACTIVITY_LEVEL_HIGH = 4;
}

enum FitnessGoal {
  FITNESS_GOAL_UNSPECIFIED = 0;
  FITNESS_GOAL_LOSE_WEIGHT = 1;
  FITNESS_GOAL_MAINTAIN_WEIGHT = 2;
  FITNESS_GOAL_GAIN_MUSCLE = 3;
}

enum TrainingLocation {
  TRAINING_LOCATION_UNSPECIFIED = 0;
  TRAINING_LOCATION_HOME = 1;
  TRAINING_LOCATION_GYM = 2;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  string birth_date = 4;
}

message CreateUserResponse {
  string user_id = 1;
}

message VerifyCredentialsRequest {
  string email = 1;
  string password = 2;
}

message VerifyCredentialsResponse {
  string user_id = 1;
  bool profile_completed = 2;
}

message SaveProfileRequest {
  string user_id = 1;
  int32 age = 2; // В ходе разработки решу, брать из даты рожд. или из анкеты
  Gender gender = 3;
  int32 height_cm = 4;
  double weight_kg = 5;
  TrainingLevel training_level = 6;
  ActivityLevel activity_level = 7;
  FitnessGoal goal = 8;
  optional double target_weight_kg = 9;
  repeated string allergies = 10;
  repeated string excluded_foods = 11;
  repeated string food_preferences = 12;
  TrainingLocation training_location = 13;
  int32 training_days_per_week = 14;
  string equipment = 15;
}

message SaveProfileResponse {
  bool profile_completed = 1;
  double bmi = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string name = 2;
  string email = 3;
  string birth_date = 4;
  bool profile_completed = 5;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  string user_id = 1;
  int32 age = 2;
  Gender gender = 3;
  int32 height_cm = 4;
  double weight_kg = 5;
  TrainingLevel training_level = 6;
  ActivityLevel activity_level = 7;
  FitnessGoal goal = 8;
  optional double target_weight_kg = 9;
  repeated string allergies = 10;
  repeated string excluded_foods = 11;
  repeated string food_preferences = 12;
  TrainingLocation training_location = 13;
  int32 training_days_per_week = 14;
  string equipment = 15;
}
