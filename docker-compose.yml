services:
  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  user-service:
    build:
      context: .
      dockerfile: ./backend/user-service/Dockerfile
    env_file:
      - .env
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${USER_GRPC_PORT:-50051}:${USER_GRPC_PORT:-50051}"
    stop_grace_period: 10s

  api-gateway-service:
    build:
      context: .
      dockerfile: ./backend/api-gateway-service/Dockerfile
    env_file:
      - .env
    depends_on:
      user-service:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:${GATEWAY_HTTP_PORT:-8080}"
    stop_grace_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    depends_on:
      api-gateway-service:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:${GATEWAY_HTTP_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  user-db-data:
