services:
  user-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: ${USER_DB_NAME}
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  user-service:
    build:
      context: .
      dockerfile: ./backend/user-service/Dockerfile
    env_file:
      - .env
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${USER_GRPC_PORT:-50051}:${USER_GRPC_PORT:-50051}"
    stop_grace_period: 10s

  api-gateway-service:
    build:
      context: .
      dockerfile: ./backend/api-gateway-service/Dockerfile
    env_file:
      - .env
    depends_on:
      user-service:
        condition: service_started
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:${GATEWAY_HTTP_PORT:-8080}"
    stop_grace_period: 10s

  nutrition-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${NUTRITION_DB_USER}
      POSTGRES_PASSWORD: ${NUTRITION_DB_PASSWORD}
      POSTGRES_DB: ${NUTRITION_DB_NAME}
    volumes:
      - nutrition-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  nutrition-migrate:
    image: migrate/migrate
    depends_on:
      nutrition-db:
        condition: service_healthy
    volumes:
      - ./backend/nutrition-service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${NUTRITION_DB_USER}:${NUTRITION_DB_PASSWORD}@${NUTRITION_DB_HOST}:${NUTRITION_DB_PORT}/${NUTRITION_DB_NAME}?sslmode=${NUTRITION_DB_SSL_MODE}"
      - "up"
    restart: on-failure

  nutrition-service:
    build:
      context: ./backend/nutrition-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${NUTRITION_DB_USER}:${NUTRITION_DB_PASSWORD}@${NUTRITION_DB_HOST}:${NUTRITION_DB_PORT}/${NUTRITION_DB_NAME}?sslmode=${NUTRITION_DB_SSL_MODE}
      GRPC_PORT: ${NUTRITION_GRPC_PORT:-50052}
      GAMIFICATION_SERVICE_ADDR: ${NUTRITION_GAMIFICATION_SERVICE_ADDR}
    depends_on:
      nutrition-db:
        condition: service_healthy
      nutrition-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${NUTRITION_GRPC_PORT:-50052}:${NUTRITION_GRPC_PORT:-50052}"
    stop_grace_period: 10s

  workout-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${WORKOUT_DB_USER}
      POSTGRES_PASSWORD: ${WORKOUT_DB_PASSWORD}
      POSTGRES_DB: ${WORKOUT_DB_NAME}
    volumes:
      - workout-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  workout-migrate:
    image: migrate/migrate
    depends_on:
      workout-db:
        condition: service_healthy
    volumes:
      - ./backend/workout-service/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${WORKOUT_DB_USER}:${WORKOUT_DB_PASSWORD}@${WORKOUT_DB_HOST}:${WORKOUT_DB_PORT}/${WORKOUT_DB_NAME}?sslmode=${WORKOUT_DB_SSL_MODE}"
      - "up"
    restart: on-failure

  workout-service:
    build:
      context: .
      dockerfile: ./backend/workout-service/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${WORKOUT_DB_USER}:${WORKOUT_DB_PASSWORD}@${WORKOUT_DB_HOST}:${WORKOUT_DB_PORT}/${WORKOUT_DB_NAME}?sslmode=${WORKOUT_DB_SSL_MODE}
      GRPC_PORT: ${WORKOUT_GRPC_PORT:-50054}
      GAMIFICATION_SERVICE_ADDR: ${WORKOUT_GAMIFICATION_SERVICE_ADDR}
    depends_on:
      workout-db:
        condition: service_healthy
      workout-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${WORKOUT_GRPC_PORT:-50054}:${WORKOUT_GRPC_PORT:-50054}"
    stop_grace_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    depends_on:
      api-gateway-service:
        condition: service_started
    environment:
      VITE_API_BASE_URL: http://localhost:${GATEWAY_HTTP_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  user-db-data:
  nutrition-db-data:
  workout-db-data:
